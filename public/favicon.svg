<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="fcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#22c55e" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Dark squircle base -->
  <rect width="64" height="64" rx="18" fill="#050607" stroke="#22c55e" stroke-width="2.5" />
  
  <!-- Dumbbell Icon -->
  <g transform="translate(14, 14)" filter="url(#fcGlow)">
    <!-- Left Plates -->
    <rect x="0" y="6" width="5" height="24" rx="2.5" fill="url(#fcGrad)" />
    <rect x="5" y="10" width="3" height="16" rx="1.5" fill="url(#fcGrad)" opacity="0.85" />
    
    <!-- Barbell Shaft -->
    <rect x="8" y="16" width="20" height="4" rx="2" fill="url(#fcGrad)" />
    
    <!-- Right Plates -->
    <rect x="28" y="10" width="3" height="16" rx="1.5" fill="url(#fcGrad)" opacity="0.85" />
    <rect x="31" y="6" width="5" height="24" rx="2.5" fill="url(#fcGrad)" />
    
    <!-- Center Accent Grip -->
    <circle cx="18" cy="18" r="3" fill="#050607" stroke="#22c55e" stroke-width="2"/>
  </g>
</svg>
